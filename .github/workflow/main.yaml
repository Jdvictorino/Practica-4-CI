name: Notificación push a ntfy.sh

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Notificación push devops itla
        run: |
          curl -H "Title: ITLA's devops Team - Alert" \
               -H "Priority: default" \
               -d "Todos los Cambios para el repositorio '  ${{ github.repository }}' por '${{ github.actor }}' fueron aprobados." \
               https://ntfy.sh/Practica-4-CI
