name: Notificación push a ntfy.sh

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Notificación push devops itla
        run: |
          curl -H "Title: ITLA's devops Team - Alert" \
               -H "Priority: default" \
               -d "El Usuario ${{ github.actor }} realizó push al repositorio ${{ github.repository }} del branch ${{ github.ref_name }}" \
               -d "Mensaje del Commit: ${{ github.event.head_commit.message }}" \
               -d "Link: ${{ github.event.head_commit.url }}" \
               https://ntfy.sh/Practica-4-CI
